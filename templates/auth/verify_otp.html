{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4>Verify OTP</h4>
            </div>
            <div class="card-body">
                <p>Enter the 6-digit OTP sent to <strong>{{ email }}</strong></p>
                <form method="POST">
                    <input type="hidden" name="email" value="{{ email }}">
                    <div class="mb-3">
                        <label for="otp" class="form-label">OTP Code</label>
                        <input type="text" class="form-control" id="otp" name="otp" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Verify OTP</button>
                    <a href="{{ url_for('auth.forgot_password') }}" class="btn btn-link">Resend OTP</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
