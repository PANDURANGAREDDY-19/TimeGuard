services:
  - type: web
    name: timeguard-app
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: timeguard-db
          property: connectionString

databases:
  - name: timeguard-db
    databaseName: timeguard
    user: timeguard_user